[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nasdaq100-cn-etf-dataset"
version = "0.1.0"
description = "Database-free dataset pipeline for China-listed Nasdaq-100 ETFs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Wilson-Wang"}]
dependencies = [
  "akshare>=1.18.94,<1.19",
  "baostock>=0.9.3,<1",
  "duckdb>=1.1,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
  "requests>=2.32,<3",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
