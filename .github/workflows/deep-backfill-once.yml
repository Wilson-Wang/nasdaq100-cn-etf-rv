name: Deep history backfill (one-shot)

on:
  push:
    paths:
      - "ops/deep-backfill.trigger"

permissions:
  contents: write

concurrency:
  group: etf-deep-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Capture baseline
        run: |
          mkdir -p /tmp/deep-backfill-baseline
          cp data/pair_analysis.csv /tmp/deep-backfill-baseline/pair_analysis.csv
          cp data/pair_events.csv /tmp/deep-backfill-baseline/pair_events.csv
          cp data/etf_prices.csv /tmp/deep-backfill-baseline/etf_prices.csv
      - name: Deep backfill 1100 calendar days
        run: python scripts/backfill_research_history.py --lookback-days 1100
      - name: Reconcile exchange calendar
        run: python scripts/reconcile_exchange_calendar.py
      - name: Update execution readiness
        run: python scripts/update_execution_readiness.py
      - name: Update metadata and PQS
        run: python scripts/update_metadata.py
      - name: Update prospective events
        run: python scripts/update_events.py
      - name: Re-analyze all ETF pairs
        run: python scripts/analyze_pairs.py
      - name: Validate base dataset
        run: python scripts/validate_dataset.py
      - name: Validate research outputs
        run: python scripts/validate_research_outputs.py
      - name: Build before/after report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          base = Path('/tmp/deep-backfill-baseline')
          data = Path('data')
          before = pd.read_csv(base / 'pair_analysis.csv')
          after = pd.read_csv(data / 'pair_analysis.csv')
          prices_before = pd.read_csv(base / 'etf_prices.csv', dtype={'symbol':'string'})
          prices_after = pd.read_csv(data / 'etf_prices.csv', dtype={'symbol':'string'})
          events_before = pd.read_csv(base / 'pair_events.csv')
          events_after = pd.read_csv(data / 'pair_events.csv')

          def price_stats(df):
              df = df.copy()
              df['symbol'] = df['symbol'].astype('string')
              out = {}
              for symbol, g in df.groupby('symbol'):
                  out[str(symbol)] = {
                      'rows': int(len(g)),
                      'min_date': str(g['date'].min()),
                      'max_date': str(g['date'].max()),
                  }
              return out

          merged = before.merge(after, on='pair', suffixes=('_before','_after'), how='outer', validate='one_to_one')
          numeric = [
              'aligned_observations','half_life','adf_p','kpss_p','stability_ratio',
              'signal_count','adjusted_win_rate_5d','median_realized_net_alpha_5d',
              'p25_realized_net_alpha_5d','pair_score','net_expected_convergence_5d'
          ]
          changes = {}
          for col in numeric:
              b = pd.to_numeric(merged.get(f'{col}_before'), errors='coerce')
              a = pd.to_numeric(merged.get(f'{col}_after'), errors='coerce')
              d = a - b
              valid = d.dropna()
              changes[col] = {
                  'mean_before': float(b.mean()) if b.notna().any() else None,
                  'mean_after': float(a.mean()) if a.notna().any() else None,
                  'median_delta': float(valid.median()) if not valid.empty else None,
                  'mean_abs_delta': float(valid.abs().mean()) if not valid.empty else None,
                  'max_abs_delta': float(valid.abs().max()) if not valid.empty else None,
              }

          sig_before = before['signal'].value_counts().to_dict()
          sig_after = after['signal'].value_counts().to_dict()
          signal_changed = merged[
              merged['signal_before'].fillna('') != merged['signal_after'].fillna('')
          ][['pair','signal_before','signal_after']].to_dict('records')

          # Material changes chosen to flag practical rather than microscopic floating-point changes.
          flags = []
          for _, row in merged.iterrows():
              pair = row['pair']
              def num(name, side):
                  v = row.get(f'{name}_{side}')
                  try:
                      return float(v) if pd.notna(v) else np.nan
                  except Exception:
                      return np.nan
              hl_b, hl_a = num('half_life','before'), num('half_life','after')
              adf_b, adf_a = num('adf_p','before'), num('adf_p','after')
              st_b, st_a = num('stability_ratio','before'), num('stability_ratio','after')
              n_b, n_a = num('signal_count','before'), num('signal_count','after')
              wr_b, wr_a = num('adjusted_win_rate_5d','before'), num('adjusted_win_rate_5d','after')
              med_b, med_a = num('median_realized_net_alpha_5d','before'), num('median_realized_net_alpha_5d','after')
              ps_b, ps_a = num('pair_score','before'), num('pair_score','after')
              reasons = []
              if np.isfinite(hl_b) and np.isfinite(hl_a) and abs(hl_a-hl_b) > max(0.5, 0.2*abs(hl_b)):
                  reasons.append('half_life')
              if np.isfinite(adf_b) and np.isfinite(adf_a):
                  for threshold in (0.05, 0.10):
                      if (adf_b <= threshold) != (adf_a <= threshold):
                          reasons.append(f'adf_cross_{threshold}')
              if np.isfinite(st_b) and np.isfinite(st_a) and abs(st_a-st_b) >= 0.25:
                  reasons.append('stability_ratio')
              if np.isfinite(n_b) and np.isfinite(n_a) and abs(n_a-n_b) >= 3:
                  reasons.append('event_count')
              if np.isfinite(wr_b) and np.isfinite(wr_a) and abs(wr_a-wr_b) >= 0.10:
                  reasons.append('adjusted_win_rate')
              if np.isfinite(med_b) and np.isfinite(med_a) and abs(med_a-med_b) >= 0.003:
                  reasons.append('median_net_alpha')
              if np.isfinite(ps_b) and np.isfinite(ps_a) and abs(ps_a-ps_b) >= 10:
                  reasons.append('pair_score')
              if str(row.get('signal_before','')) != str(row.get('signal_after','')):
                  reasons.append('signal_class')
              if reasons:
                  flags.append({'pair': pair, 'reasons': sorted(set(reasons))})

          event_pair_before = events_before['pair'].value_counts().to_dict() if 'pair' in events_before.columns else {}
          event_pair_after = events_after['pair'].value_counts().to_dict() if 'pair' in events_after.columns else {}
          report = {
              'lookback_calendar_days': 1100,
              'price_depth_before': price_stats(prices_before),
              'price_depth_after': price_stats(prices_after),
              'symbols_at_least_500_before': int(sum(v['rows'] >= 500 for v in price_stats(prices_before).values())),
              'symbols_at_least_500_after': int(sum(v['rows'] >= 500 for v in price_stats(prices_after).values())),
              'pair_count_before': int(len(before)),
              'pair_count_after': int(len(after)),
              'event_rows_before': int(len(events_before)),
              'event_rows_after': int(len(events_after)),
              'event_pair_counts_before': {str(k): int(v) for k,v in event_pair_before.items()},
              'event_pair_counts_after': {str(k): int(v) for k,v in event_pair_after.items()},
              'signal_counts_before': {str(k): int(v) for k,v in sig_before.items()},
              'signal_counts_after': {str(k): int(v) for k,v in sig_after.items()},
              'signal_class_changes': signal_changed,
              'metric_changes': changes,
              'material_change_flags': flags,
              'material_change_pair_count': int(len(flags)),
              'interpretation_note': 'Current AR/ADF/KPSS/HL use recent windows, so pure older-history backfill should leave current parameters near-identical; historical event/backtest statistics may change materially because more crossing events become observable.'
          }
          (data / 'deep_backfill_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({
              'symbols_at_least_500_after': report['symbols_at_least_500_after'],
              'event_rows_before': report['event_rows_before'],
              'event_rows_after': report['event_rows_after'],
              'material_change_pair_count': report['material_change_pair_count'],
              'signal_class_changes': len(report['signal_class_changes']),
          }, ensure_ascii=False))
          PY
      - name: Commit backfill outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: deep backfill research history"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
