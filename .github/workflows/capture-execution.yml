name: Capture ETF execution observations

on:
  workflow_dispatch:
  schedule:
    - cron: "50 14 * * 1-5"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: etf-execution-observation
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Capture live execution observation
        run: python scripts/capture_execution_observation.py
      - name: Commit observation
        run: |
          if [ -z "$(git status --porcelain -- data/execution_history.csv data/execution_history.parquet)" ]; then
            echo "No execution-observation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/execution_history.csv data/execution_history.parquet
          git commit -m "data: capture ETF execution observation"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
