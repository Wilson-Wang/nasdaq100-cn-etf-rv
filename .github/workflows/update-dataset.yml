name: Update ETF dataset

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/dataset-update-trigger"
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: etf-dataset-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Update dataset
        run: python scripts/update_dataset.py --lookback-days 450
      - name: Reconcile exchange calendar
        run: python scripts/reconcile_exchange_calendar.py
      - name: Check stored research depth
        run: python scripts/check_history_depth.py
      - name: Check historical regime coverage
        run: python scripts/check_regime_history_coverage.py
      - name: Update execution readiness
        run: python scripts/update_execution_readiness.py
      - name: Update metadata and PQS
        run: python scripts/update_metadata.py
      - name: Update prospective events
        run: python scripts/update_events.py
      - name: Analyze ETF pairs
        run: python scripts/analyze_pairs.py
      - name: Analyze common-factor challenger
        run: python scripts/analyze_factor_residuals.py
      - name: Analyze price-ratio diagnostic
        run: python scripts/analyze_price_ratio_diagnostics.py
      - name: Build portfolio research plan
        run: python scripts/build_portfolio_plan.py
      - name: Persist risk policy
        run: python scripts/build_risk_policy.py
      - name: Update frozen OOS ledger
        run: python scripts/update_oos.py
      - name: Calibrate execution-cost challenger
        run: python scripts/calibrate_execution_cost.py
      - name: Check source and research health
        run: python scripts/check_research_health.py
      - name: Generate FULL DELTA daily report
        run: python scripts/generate_daily_report.py
      - name: Validate base dataset
        run: python scripts/validate_dataset.py
      - name: Validate research outputs
        run: python scripts/validate_research_outputs.py
      - name: Commit changed dataset
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No dataset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh ETF research dataset"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
