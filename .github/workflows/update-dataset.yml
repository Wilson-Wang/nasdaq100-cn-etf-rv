name: Update ETF dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/dataset-update-trigger"
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: etf-dataset-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Update dataset
        run: python scripts/update_dataset.py --lookback-days 450
      - name: Validate
        run: python scripts/validate_dataset.py
      - name: Commit changed dataset
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No dataset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh ETF dataset"
          git push
